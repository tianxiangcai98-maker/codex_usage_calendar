name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check.py
      - run: python3 scripts/audit_public.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks with checksum validation
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output gitleaks.tar.gz
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          name = f"gitleaks_{os.environ['GITLEAKS_VERSION']}_linux_x64.tar.gz"
          expected = next(line.split()[0] for line in Path('checksums.txt').read_text().splitlines() if line.split()[-1] == name)
          actual = hashlib.sha256(Path('gitleaks.tar.gz').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Checksum mismatch')
          PY
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan complete Git history with redacted output
        run: gitleaks git . --redact --no-banner
